<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Pomodoro Timer</title>
</head>

<body>
    <div class="center padding-standard">
        <h1 class="center">
            Pomodoro Timer
        </h1>
    </div>
    <div class="center padding-standard">
        <h2 class="center">
            Current Time:
        </h2>
        <h3 class="center padding-standard" id="clock"></h3>
    </div>
    <div>
        <h2 class="center padding-standard clock-container" id="timer-30">
            <button class="rounded-button padding-standard" onclick="startTimer('timer-30')">
                <p class="timer-text">30:00</p>
            </button>
        </h2>
    </div>
    <div class="center padding-standard">
        <button id="goToHomePage" class="rounded-button padding-standard" onclick="goToHomePage()">Back</button>
    </div>
    <script src="./scripts.js"></script>
</body>

</html>
